services:
  postgres:
    image: postgres:16-alpine
    container_name: heart_and_beans_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: heart_and_beans
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d heart_and_beans"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
